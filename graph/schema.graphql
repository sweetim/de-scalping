type Ticket @entity(immutable: true) {
  id: Bytes!
  transactionHash: Bytes!
  timestamp_s: BigInt!
  owner: Bytes!
  ticketShop: Bytes!
  ticketTypeIndex: BigInt!
  ticketId: BigInt!
  ticketName: String!
  ticketPrice: BigInt!

  erc20TokenAddress: Bytes
  nftAddress: Bytes
}

