type TicketShop @entity(immutable: true) {
  id: Bytes!
  timestamp_s: BigInt!
  ownerAddress: Bytes!
  ticketShopAddress: Bytes!
  erc20TokenAddress: Bytes!
  paymasterAddress: Bytes!
  nftAddress: Bytes!
  totalTickets: BigInt!
  metadata: TicketMetadata!
}

type TicketMetadata @entity(immutable: true) {
  id: Bytes!
  name: String!
  description: String!
  uri: String!
  dates: [BigInt!]!
  location_uri: String!
  location_name: String!
  pricing: TicketPricing!
}

type TicketPricing @entity(immutable: true) {
  id: Bytes!
  name: [String!]!
  description: [String!]!
  price: [BigInt!]!
  soldTickets: [BigInt!]!
  totalTickets: [BigInt!]!
}

